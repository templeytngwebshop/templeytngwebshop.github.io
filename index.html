<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Notepad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="loginPage">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Enter username">
        <button onclick="login()">Login</button>
    </div>

    <!-- APP -->
    <div id="app" style="display:none;">

        <header>
            <h1>My Online Notepad</h1>

            <input type="text" id="searchBar" placeholder="Search notes..." onkeyup="searchNotes()">

            <button onclick="createTab()">+ New Tab</button>
        </header>

        <!-- TOOLBAR -->
        <div class="toolbar">

            <select onchange="changeFontSize(this.value)">
                <option value="16px">16</option>
                <option value="20px">20</option>
                <option value="24px">24</option>
            </select>

            <input type="color" onchange="changeFontColor(this.value)">

            <button onclick="boldText()">Bold</button>
            <button onclick="italicText()">Italic</button>

            <input type="color" onchange="changeBackground(this.value)">

            <input type="file" id="imageUpload" accept="image/*">

            <button onclick="saveNote()">Save Note</button>

        </div>

        <!-- TABS -->
        <div id="tabs"></div>

        <!-- NOTE AREA -->
        <div id="editor" contenteditable="true"></div>

        <!-- IMAGE PREVIEW -->
        <div id="images"></div>

        <!-- GOOGLE TRANSLATE -->
        <div id="google_translate_element"></div>

        <!-- MUSIC PLAYER -->
        <div class="music-player">
            <audio controls>
                <source src="music.mp3" type="audio/mp3">
            </audio>
        </div>

    </div>

    <script src="script.js"></script>

    <!-- Google Translate -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {pageLanguage: 'en'},
                'google_translate_element'
            );
        }
    </script>

    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
