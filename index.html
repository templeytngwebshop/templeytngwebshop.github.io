<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templeyt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  display:flex;
  height:100vh;
  background:#f4f5f9;
  color:#333;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  background:white;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
}

.logo{
  padding:20px;
  font-size:28px;
  font-weight:bold;
  color:#5b4bff;
  border-bottom:1px solid #eee;
}

.search{
  padding:15px;
}

.search input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#f1f2f6;
  outline:none;
}

.notes{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.note{
  background:#fafafa;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
  transition:0.2s;
}

.note:hover{
  background:#eef1ff;
}

.note.active{
  background:#dde3ff;
  border:1px solid #5b4bff;
}

.note-title{
  font-weight:bold;
}

.new-btn{
  margin:15px;
  padding:14px;
  border:none;
  background:#5b4bff;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOOLBAR */

.toolbar{
  background:white;
  padding:10px;
  border-bottom:1px solid #ddd;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.toolbar button,
.toolbar select,
.toolbar input{
  padding:8px;
  border-radius:8px;
  border:1px solid #ddd;
  background:white;
  cursor:pointer;
}

/* TITLE */

.title{
  padding:20px;
  background:white;
  border-bottom:1px solid #ddd;
}

.title input{
  width:100%;
  font-size:28px;
  border:none;
  outline:none;
  font-weight:bold;
}

/* EDITOR */

.editor{
  flex:1;
  padding:30px;
  overflow:auto;
}

#editor{
  min-height:100%;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
  outline:none;
  line-height:1.7;
}

/* MOBILE */

@media(max-width:768px){

  body{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    height:300px;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    Templeyt
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="Search notes...">
  </div>

  <div class="notes" id="notes"></div>

  <button class="new-btn" onclick="createNote()">
    + New Note
  </button>

</div>

<!-- MAIN -->

<div class="main">

  <!-- TOOLBAR -->

  <div class="toolbar">

    <button onclick="format('bold')"><b>B</b></button>

    <button onclick="format('italic')"><i>I</i></button>

    <button onclick="format('underline')"><u>U</u></button>

    <button onclick="format('insertUnorderedList')">• List</button>

    <button onclick="format('insertOrderedList')">1. List</button>

    <button onclick="format('justifyLeft')">⬅</button>

    <button onclick="format('justifyCenter')">⬌</button>

    <button onclick="format('justifyRight')">➡</button>

    <select id="fontName">
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Courier New">Courier</option>
      <option value="Tahoma">Tahoma</option>
    </select>

    <select id="fontSize">
      <option value="3">Normal</option>
      <option value="5">Large</option>
      <option value="7">Huge</option>
    </select>

    <input type="color" id="fontColor">

    <input type="color" id="bgColor">

    <input type="file" id="bgImage">

    <button onclick="toggleDarkMode()">🌙</button>

  </div>

  <!-- TITLE -->

  <div class="title">
    <input type="text" id="title" placeholder="Untitled Note">
  </div>

  <!-- EDITOR -->

  <div class="editor">
    <div id="editor" contenteditable="true"></div>
  </div>

</div>

<script>

/* DATA */

let notes = JSON.parse(localStorage.getItem("templeyt-notes")) || [];

let activeNote = null;

/* ELEMENTS */

const notesEl = document.getElementById("notes");
const titleEl = document.getElementById("title");
const editorEl = document.getElementById("editor");
const searchEl = document.getElementById("search");

/* CREATE NOTE */

function createNote(){

  const note = {
    id:Date.now(),
    title:"Untitled Note",
    content:"",
    bgColor:"#ffffff",
    bgImage:""
  };

  notes.unshift(note);

  save();

  renderNotes();

  openNote(note.id);

}

/* SAVE */

function save(){

  localStorage.setItem(
    "templeyt-notes",
    JSON.stringify(notes)
  );

}

/* RENDER NOTES */

function renderNotes(filter=""){

  notesEl.innerHTML = "";

  const filtered = notes.filter(note =>
    note.title.toLowerCase().includes(filter.toLowerCase()) ||
    note.content.toLowerCase().includes(filter.toLowerCase())
  );

  filtered.forEach(note=>{

    const div = document.createElement("div");

    div.className = "note";

    if(activeNote && activeNote.id === note.id){
      div.classList.add("active");
    }

    div.innerHTML = `
      <div class="note-title">${note.title}</div>
    `;

    div.onclick = ()=> openNote(note.id);

    notesEl.appendChild(div);

  });

}

/* OPEN NOTE */

function openNote(id){

  activeNote = notes.find(n=>n.id===id);

  titleEl.value = activeNote.title;

  editorEl.innerHTML = activeNote.content;

  editorEl.style.backgroundColor = activeNote.bgColor || "#fff";

  if(activeNote.bgImage){

    editorEl.style.backgroundImage = `url(${activeNote.bgImage})`;

    editorEl.style.backgroundSize = "cover";

  }else{

    editorEl.style.backgroundImage = "";

  }

  renderNotes(searchEl.value);

}

/* UPDATE */

titleEl.addEventListener("input", ()=>{

  if(!activeNote) return;

  activeNote.title = titleEl.value;

  save();

  renderNotes(searchEl.value);

});

editorEl.addEventListener("input", ()=>{

  if(!activeNote) return;

  activeNote.content = editorEl.innerHTML;

  save();

});

/* SEARCH */

searchEl.addEventListener("input", ()=>{

  renderNotes(searchEl.value);

});

/* FORMAT */

function format(command){

  document.execCommand(command,false,null);

}

/* FONT */

document.getElementById("fontName")
.addEventListener("change", function(){

  document.execCommand(
    "fontName",
    false,
    this.value
  );

});

document.getElementById("fontSize")
.addEventListener("change", function(){

  document.execCommand(
    "fontSize",
    false,
    this.value
  );

});

document.getElementById("fontColor")
.addEventListener("input", function(){

  document.execCommand(
    "foreColor",
    false,
    this.value
  );

});

/* BG COLOR */

document.getElementById("bgColor")
.addEventListener("input", function(){

  if(!activeNote) return;

  editorEl.style.backgroundColor = this.value;

  activeNote.bgColor = this.value;

  save();

});

/* BG IMAGE */

document.getElementById("bgImage")
.addEventListener("change", function(e){

  const file = e.target.files[0];

  const reader = new FileReader();

  reader.onload = function(){

    editorEl.style.backgroundImage =
      `url(${reader.result})`;

    editorEl.style.backgroundSize = "cover";

    activeNote.bgImage = reader.result;

    save();

  };

  reader.readAsDataURL(file);

});

/* DARK MODE */

let dark = false;

function toggleDarkMode(){

  dark = !dark;

  if(dark){

    document.body.style.background = "#1e1e1e";

    document.body.style.color = "white";

  }else{

    document.body.style.background = "#f4f5f9";

    document.body.style.color = "#333";

  }

}

/* INIT */

renderNotes();

if(notes.length>0){

  openNote(notes[0].id);

}

</script>

</body>
</html>
