<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templeyt - Online Notepad</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 42px;
      color: #2d3748;
    }

    .header p {
      color: #718096;
      margin-top: 5px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .search-box input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 5px rgba(79,70,229,0.3);
    }

    textarea {
      width: 100%;
      height: 70vh;
      padding: 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      resize: none;
      outline: none;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      line-height: 1.6;
    }

    .footer {
      margin-top: 15px;
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    mark {
      background: yellow;
      padding: 2px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 32px;
      }

      textarea {
        height: 65vh;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Templeyt</h1>
      <p>Simple • Fast • Professional Online Notepad</p>
    </div>

    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search notes..."
      >
    </div>

    <textarea 
      id="notepad" 
      placeholder="Start writing your notes here..."
    ></textarea>

    <div class="footer">
      Notes are automatically saved in your browser.
    </div>

  </div>

  <script>
    const notepad = document.getElementById("notepad");
    const searchInput = document.getElementById("searchInput");

    // Load saved note
    notepad.value = localStorage.getItem("templeyt-note") || "";

    // Auto-save notes
    notepad.addEventListener("input", () => {
      localStorage.setItem("templeyt-note", notepad.value);
    });

    // Search feature
    searchInput.addEventListener("input", () => {
      const searchText = searchInput.value.toLowerCase();
      const noteText = notepad.value.toLowerCase();

      if (searchText && noteText.includes(searchText)) {
        searchInput.style.borderColor = "green";
      } else {
        searchInput.style.borderColor = "#dcdfe6";
      }
    });
  </script>

</body>
</html>
