<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Notes App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LOGIN -->
<div id="login-container">
  <div class="login-box">
    <h2>Notebook Login</h2>

    <input type="text" id="username" placeholder="Username"/>
    <input type="password" id="password" placeholder="Password"/>

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Templates</h2>

    <button onclick="createTab()">+ New Tab</button>

    <div id="tabs"></div>

    <hr>

    <h3>Themes</h3>

    <button onclick="changeTheme('#ffffff')">Light</button>
    <button onclick="changeTheme('#1e1e1e')">Dark</button>
    <button onclick="changeTheme('#f5e6ff')">Purple</button>
    <button onclick="changeTheme('#dfffe0')">Green</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="toolbar">

      <input type="text"
             id="searchBar"
             placeholder="Search notes..."
             onkeyup="searchNotes()"/>

      <select onchange="fontSize(this.value)">
        <option value="16px">16</option>
        <option value="20px">20</option>
        <option value="24px">24</option>
        <option value="30px">30</option>
      </select>

      <input type="color"
             onchange="fontColor(this.value)"/>

      <button onclick="boldText()">B</button>
      <button onclick="italicText()">I</button>
      <button onclick="underlineText()">U</button>

      <input type="file"
             id="imageUpload"
             accept="image/*"/>

      <button onclick="saveCurrentNote()">Save</button>

    </div>

    <!-- NOTE TITLE -->
    <input type="text"
           id="noteTitle"
           placeholder="Note Title"/>

    <!-- EDITOR -->
    <div id="editor" contenteditable="true"></div>

    <!-- IMAGES -->
    <div id="imageContainer"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
